packages:
  - apps/*
  - packages/*

catalog:
  '@elysiajs/eden': 1.4.9
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/react-native': 13.3.3
  '@types/jest': 29.5.14
  '@types/react': 19.1.17
  elysia: 1.4.30
  jest: 29.7.0
  'jest-environment-node': 29.7.0
  'jest-expo': 54.0.18
  jsdom: 26.0.0
  react: 19.1.0
  react-dom: 19.1.0
  react-native: 0.81.5
  react-native-web: 0.21.3
  react-test-renderer: 19.1.0
  'ts-jest': 29.4.14
  typescript: 5.9.3

nodeLinker: hoisted

# Só instala versões publicadas há pelo menos 14 dias (proteção contra supply chain).
# Para um patch de segurança urgente, liste o pacote em minimumReleaseAgeExclude.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Patch das advisories críticas GHSA-8r5x-fm3f-whwj e GHSA-p8wg-vrv2-v86f
  # (4.7.10, de 2026-10-05). Remover depois de 2026-10-19.
  - handlebars

# Correções de segurança em dependências transitivas (pnpm audit), sempre no mesmo major.
# Remover cada entrada quando o pacote que a puxa passar a depender da versão corrigida.
overrides:
  '@babel/core@<7.29.6': ^7.29.6
  '@tootallnate/once@<2.0.1': ^2.0.1
  '@xmldom/xmldom@<0.8.15': ^0.8.15
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2 <2.1.7': ^2.1.7
  'browserslist@<4.28.7': ^4.28.7
  'compression@<1.8.2': ^1.8.2
  'diff@>=3 <3.5.1': ^3.5.1
  'fflate@<0.8.3': ^0.8.3
  'form-data@>=4 <4.0.6': ^4.0.6
  'glob@>=10 <10.5.0': ^10.5.0
  'handlebars@>=4 <4.7.10': ^4.7.10
  'js-yaml@<3.15.2': ^3.15.2
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'lodash@<4.18.0': ^4.18.0
  'minimatch@<3.1.4': ^3.1.4
  'minimatch@>=5 <5.1.8': ^5.1.8
  'minimatch@>=9 <9.0.7': ^9.0.7
  'nanoid@<3.3.18': ^3.3.18
  'nanoid@>=5 <5.1.16': ^5.1.16
  'picomatch@<2.3.2': ^2.3.2
  'picomatch@>=4 <4.0.4': ^4.0.4
  'postcss@<8.5.23': ^8.5.23
  'postcss-selector-parser@>=6 <6.1.3': ^6.1.3
  'shell-quote@<1.9.0': ^1.9.0
  'source-map-js@<1.2.2': ^1.2.2
  'undici@>=6 <6.28.1': ^6.28.1
  'ws@>=6 <6.2.4': ^6.2.4
  'ws@>=7 <7.5.11': ^7.5.11
  'ws@>=8 <8.21.0': ^8.21.0
  'yaml@>=2 <2.8.3': ^2.8.3

# Advisories high sem correção no mesmo major, todas em ferramentas de build e
# teste (nunca no bundle do app nem na API). Revisar a cada atualização do Expo.
auditConfig:
  ignoreGhsas:
    # image-size 1.2.1 via metro: só lê as imagens do próprio repo no bundle.
    # A correção (2.0.3) é major e o metro ainda depende da 1.x.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    # node-forge via @expo/cli: gera o certificado do dev server; não verifica
    # assinatura de terceiros. Sem versão corrigida.
    - GHSA-86w9-cpqp-85rv
    # braces via chokidar (kysely-pglite): padrões vêm do nosso código, não de
    # input. Sem versão corrigida.
    - GHSA-vfj7-8cjw-p6xm

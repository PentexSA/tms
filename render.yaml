# Deploy de teste (mesa de teste), não o de produção: API e app web num
# serviço free do Render, banco no Neon. Detalhes em deploy/render/Dockerfile.
services:
  - type: web
    name: tms
    runtime: docker
    plan: free
    region: virginia
    # Só a release vai ao ar: o corte é o `pnpm release` (scripts/release.sh)
    branch: release
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Connection string do Neon, a direta (DATABASE_URL_UNPOOLED do
      # `neon env pull`), com sslmode=verify-full
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: 'true'
      # Error tracking (Sentry, doc/plano-observabilidade.md Fase 3). Sem DSN,
      # nada é enviado e o build não sobe source maps. O DSN do web e os dois
      # nomes abaixo entram no build como ARG (deploy/render/Dockerfile). O
      # token de upload dos source maps é um secret file `sentry_auth_token`
      # (painel do Render), nunca uma variável: variável vira ARG e fica no
      # histórico da imagem.
      - key: SENTRY_DSN
        sync: false
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false

# CI da v0 (doc/plano-v0.md, Etapa 1). Actions fixadas por SHA (supply chain);
# o comentário diz a versão. Atualize as duas juntas.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.4.3'

jobs:
  check:
    name: lint, typecheck, testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      # O código conhece tipos; o template conhece o sistema (plano-v1 §4)
      - run: node scripts/check-system-names.mjs
      # Testes com as metas de cobertura de cada pacote (bunfig.toml e jest.config.js)
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level high

  design:
    name: design (gerados em dia e contraste)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # O build valida templates e personagens e regenera os arquivos versionados
      - run: node design/scripts/build.mjs
      - name: arquivos gerados estão em dia
        run: git diff --exit-code
      - run: python3 -I design/design-system/scripts/check_tokens.py design/design-system/tokens.json design/design-system/skins/*.json

  postgres:
    name: Postgres real (migrations e tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do job; não é segredo
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # O script de publicação e o teste de concorrência rodam no Bun
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      # As migrations importam config e logger pelos artefatos compilados.
      - run: pnpm turbo run build --filter='@tms/api^...'
      # Sobe tudo, desce tudo e sobe de novo: todo down desfaz o seu up
      - run: pnpm -C packages/db migrate:check
      - name: tipos do Kysely em dia com as migrations
        run: |
          pnpm db:codegen
          git diff --exit-code packages/db/src/types.ts
      # O template da v0 publica num Postgres real (schema.json + contrato)
      - run: pnpm templates:publish --published
      # O PGLite serializa tudo; o FOR UPDATE dos eventos só se prova aqui
      - name: eventos concorrentes (lock da ficha)
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_events_test
          NODE_ENV: test
        run: pnpm -C apps/api exec bun test src/__tests__/events.pg.test.ts
      # Rolagens: a FdV é debitada uma vez, mesmo com reenvio em paralelo
      - name: rolagens concorrentes (lock da ficha)
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_rolls_test
          NODE_ENV: test
        run: pnpm -C apps/api exec bun test src/rolls/__tests__/rolls.pg.test.ts
      # A política vale o estado de quando o lote chega: concluir a criação
      # e um lote de Evoluir ao mesmo tempo (v3, Etapa 5)
      - name: política contra a conclusão (lock da ficha)
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_policy_test
          NODE_ENV: test
        run: pnpm -C apps/api exec bun test src/__tests__/policy.pg.test.ts
      # O protocolo de trava do vínculo: criar, escrever e remover ao mesmo
      # tempo, sem ficha órfã nem deadlock (v3, Etapa 7)
      - name: membros contra criação e escrita (lock do vínculo)
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_members_test
          NODE_ENV: test
        run: pnpm -C apps/api exec bun test src/__tests__/members.pg.test.ts
      # Operações em grupo: fichas travadas em ordem de id, idempotência
      # depois das travas, sem deadlock (v3, Etapa 11)
      - name: operações em grupo concorrentes (lock das fichas)
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_operations_test
          NODE_ENV: test
        run: pnpm -C apps/api exec bun test src/__tests__/operations.pg.test.ts

  e2e:
    name: E2E web (Playwright, Chromium e WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do job; o global-setup recria o schema a cada rodada
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tms_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C e2e exec playwright install --with-deps chromium webkit
      # Exporta o app web com a URL da API do E2E e confere o bundle
      - run: pnpm -C e2e build:web
      - run: pnpm -C e2e test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

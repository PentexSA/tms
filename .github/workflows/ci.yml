# CI da v0 (doc/plano-v0.md, Etapa 1). Actions fixadas por SHA (supply chain);
# o comentário diz a versão. Atualize as duas juntas. Os jobs correm em
# paralelo (doc/plano-pipeline-testes.md): o mais lento é o E2E.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # A versão do Bun fica em .bun-version: a mesma no CI e na máquina

jobs:
  check:
    name: lint, typecheck e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      # Cache do turbo entre runs: os inputs de cada tarefa declaram o que ela
      # lê (inclusive design/, nos turbo.jsonc dos pacotes)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      # O código conhece tipos; o template conhece o sistema (plano-v1 §4)
      - if: ${{ !cancelled() }}
        run: node scripts/check-system-names.mjs
      - if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high

  # Testes com as metas de cobertura de cada pacote (bunfig.toml e
  # jest.config.js). --continue: uma falha não esconde as dos outros pacotes
  test:
    name: testes (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            filter: --filter=@tms/config --filter=@tms/db --filter=@tms/sheet-core --filter=@tms/api
          - name: frontend
            filter: --filter=@tms/ui --filter=frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-test-${{ matrix.name }}-${{ github.sha }}
          restore-keys: turbo-test-${{ matrix.name }}-
      - run: pnpm turbo run test:coverage ${{ matrix.filter }} --continue --concurrency=2

  design:
    name: design (gerados em dia e contraste)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # O build valida templates e personagens e regenera os arquivos versionados
      - run: node design/scripts/build.mjs
      - name: arquivos gerados estão em dia
        run: git diff --exit-code
      - if: ${{ !cancelled() }}
        run: python3 -I design/design-system/scripts/check_tokens.py design/design-system/tokens.json design/design-system/skins/*.json

  postgres:
    name: Postgres real (migrations, tipos e concorrência)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do job; não é segredo
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # O script de publicação e os testes de concorrência rodam no Bun
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      # As migrations importam config e logger pelos artefatos compilados.
      - run: pnpm turbo run build --filter='@tms/api^...'
      # Sobe tudo, desce tudo e sobe de novo: todo down desfaz o seu up
      - run: pnpm -C packages/db migrate:check
      - name: tipos do Kysely em dia com as migrations
        run: |
          pnpm db:codegen
          git diff --exit-code packages/db/src/types.ts
      # O template da v0 publica num Postgres real (schema.json + contrato)
      - run: pnpm templates:publish --published
      # O PGLite serializa tudo: FOR UPDATE, idempotência e troca de
      # autoridade com conexões independentes só se provam aqui. Todo
      # *.pg.test.ts entra (o filtro pega src/rolls/__tests__ também), em
      # série: cada arquivo apaga e recria o schema do mesmo banco. Sem
      # PG_TEST_URL eles seriam pulados; o passo falha se algum for.
      - name: testes de concorrência em Postgres real
        if: ${{ !cancelled() }}
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/tms_pg_test
          NODE_ENV: test
        working-directory: apps/api
        run: |
          set -o pipefail
          bun test .pg.test 2>&1 | tee pg-test.log
          if grep -qE '^ *[1-9][0-9]* skip$' pg-test.log; then
            echo '::error::algum teste em Postgres real foi pulado'
            exit 1
          fi

  e2e:
    name: E2E web (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do job; o global-setup recria o schema a cada rodada
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tms_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # O mirror Azure do runner pode ficar lento e repetir downloads até
      # estourar o job. Mantém os mesmos pacotes e a verificação de assinaturas.
      - name: usar o arquivo oficial do Ubuntu para as dependências web
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          directory = Path('/etc/apt/sources.list.d')
          paths = [Path('/etc/apt/sources.list'), *directory.glob('*.list'), *directory.glob('*.sources'), *Path('/etc/apt').glob('apt-mirrors*.txt')]
          for path in paths:
              if path.is_file():
                  source = path.read_text()
                  updated = source.replace('azure.archive.ubuntu.com', 'archive.ubuntu.com')
                  if updated != source:
                      path.write_text(updated)
                      print(f'Espelho atualizado: {path}')
          PY
      # Só o navegador deste job (o cache dos binários fica como experimento:
      # o Playwright avisa que restaurá-lo custa quase o mesmo que baixar)
      - run: pnpm -C e2e exec playwright install --with-deps ${{ matrix.browser }}
      # Exporta o app web com a URL da API do E2E e confere o bundle
      - run: pnpm -C e2e build:web
      - run: pnpm -C e2e test:e2e --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 7

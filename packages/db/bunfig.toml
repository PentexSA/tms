[test]
# Só src/: o build em dist/ nunca entra nos testes
root = "./src"
# Meta mínima aplicada no CI (bun test --coverage); doc/plano-v0.md §4
coverageThreshold = { lines = 0.9, functions = 0.9 }
# Só o código do pacote conta; os outros pacotes têm as próprias metas
coveragePathIgnorePatterns = ["../**"]
